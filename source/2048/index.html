<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048 - MingZai Blog</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#faf8ef;display:flex;justify-content:center;align-items:center;min-height:100vh}
.container{text-align:center;padding:20px;max-width:500px;width:100%}
h1{font-size:2.5rem;color:#776e65;margin-bottom:10px}
.score-box{display:flex;justify-content:center;gap:20px;margin-bottom:15px}
.score-box div{background:#bbada0;color:#fff;padding:8px 20px;border-radius:6px;font-weight:bold}
.score-box div span{display:block;font-size:1.5rem}
.btn{background:#8f7a66;color:#fff;border:none;padding:10px 24px;border-radius:6px;font-size:1rem;cursor:pointer;margin-bottom:15px}
.btn:hover{background:#9f8b77}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:#bbada0;padding:8px;border-radius:8px;aspect-ratio:1;max-width:500px;margin:0 auto}
.tile{display:flex;justify-content:center;align-items:center;font-weight:bold;font-size:2rem;border-radius:4px;background:#cdc1b4;transition:all .1s;aspect-ratio:1}
.tile-2{background:#eee4da;color:#776e65}
.tile-4{background:#ede0c8;color:#776e65}
.tile-8{background:#f2b179;color:#f9f6f2}
.tile-16{background:#f59563;color:#f9f6f2}
.tile-32{background:#f67c5f;color:#f9f6f2}
.tile-64{background:#f65e3b;color:#f9f6f2}
.tile-128{background:#edcf72;color:#f9f6f2;font-size:1.8rem}
.tile-256{background:#edcc61;color:#f9f6f2;font-size:1.8rem}
.tile-512{background:#edc850;color:#f9f6f2;font-size:1.8rem}
.tile-1024{background:#edc53f;color:#f9f6f2;font-size:1.4rem}
.tile-2048{background:#edc22e;color:#f9f6f2;font-size:1.4rem}
.game-over{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(238,228,218,.73);display:flex;justify-content:center;align-items:center;z-index:100}
.game-over div{text-align:center}
.game-over h2{font-size:3rem;color:#776e65;margin-bottom:10px}
.game-over p{color:#776e65;margin-bottom:15px}
.hint{color:#776e65;margin-top:10px;font-size:0.9rem}
@media(max-width:520px){.container{padding:10px}h1{font-size:2rem}.tile{font-size:1.5rem}.tile-128,.tile-256,.tile-512{font-size:1.3rem}.tile-1024,.tile-2048{font-size:1rem}}
</style>
</head>
<body>
<div class="container">
  <h1>2048</h1>
  <div class="score-box">
    <div>分数<span id="score">0</span></div>
    <div>最高<span id="best">0</span></div>
  </div>
  <button class="btn" onclick="restart()">新游戏</button>
  <div class="grid" id="grid"></div>
  <div class="hint">方向键 / WASD 移动</div>
</div>
<script>
var SIZE = 4;
var grid = [];
var score = 0;
var best = parseInt(localStorage.getItem('game2048_best') || '0');
var over = false;

function emptyGrid() {
  return Array.from({length: SIZE}, () => Array(SIZE).fill(0));
}

function init() {
  grid = emptyGrid();
  score = 0;
  over = false;
  document.getElementById('score').textContent = '0';
  document.querySelector('.game-over') && document.querySelector('.game-over').remove();
  addRandom();
  addRandom();
  render();
}

function addRandom() {
  var empty = [];
  for (var r = 0; r < SIZE; r++)
    for (var c = 0; c < SIZE; c++)
      if (grid[r][c] === 0) empty.push([r, c]);
  if (empty.length === 0) return;
  var pos = empty[Math.floor(Math.random() * empty.length)];
  grid[pos[0]][pos[1]] = Math.random() < 0.9 ? 2 : 4;
}

function render() {
  var el = document.getElementById('grid');
  if (!el) return;
  el.innerHTML = '';
  for (var r = 0; r < SIZE; r++) {
    for (var c = 0; c < SIZE; c++) {
      var val = grid[r][c];
      var div = document.createElement('div');
      div.className = 'tile' + (val ? ' tile-' + val : '');
      div.textContent = val || '';
      el.appendChild(div);
    }
  }
}

function slideRow(row) {
  var arr = row.filter(function(v) { return v !== 0; });
  var merged = [];
  var i = 0;
  while (i < arr.length) {
    if (i + 1 < arr.length && arr[i] === arr[i + 1]) {
      merged.push(arr[i] * 2);
      score += arr[i] * 2;
      i += 2;
    } else {
      merged.push(arr[i]);
      i++;
    }
  }
  while (merged.length < SIZE) merged.push(0);
  return merged;
}

function rotate(g) {
  var n = g.length;
  var res = emptyGrid();
  for (var r = 0; r < n; r++)
    for (var c = 0; c < n; c++)
      res[c][n - 1 - r] = g[r][c];
  return res;
}

function move(d) {
  // d: 0=left,1=up,2=right,3=down
  if (over) return false;
  var old = JSON.stringify(grid);
  var g = grid;
  for (var i = 0; i < d; i++) g = rotate(g);
  for (var r = 0; r < SIZE; r++) g[r] = slideRow(g[r]);
  for (var i = 0; i < (4 - d) % 4; i++) g = rotate(g);
  grid = g;
  if (JSON.stringify(grid) !== old) {
    addRandom();
    document.getElementById('score').textContent = score;
    if (score > best) {
      best = score;
      localStorage.setItem('game2048_best', best.toString());
    }
    document.getElementById('best').textContent = best;
    render();
    checkEnd();
    return true;
  }
  return false;
}

function checkEnd() {
  for (var r = 0; r < SIZE; r++)
    for (var c = 0; c < SIZE; c++) {
      if (grid[r][c] === 2048) {
        showOver('你赢了！🎉');
        return;
      }
    }
  for (var r = 0; r < SIZE; r++)
    for (var c = 0; c < SIZE; c++) {
      if (grid[r][c] === 0) return;
      if (c + 1 < SIZE && grid[r][c] === grid[r][c + 1]) return;
      if (r + 1 < SIZE && grid[r][c] === grid[r + 1][c]) return;
    }
  showOver('游戏结束');
}

function showOver(msg) {
  over = true;
  var div = document.createElement('div');
  div.className = 'game-over';
  div.innerHTML = '<div><h2>' + msg + '</h2><p>得分: ' + score + '</p><button class="btn" onclick="restart()">再来一局</button></div>';
  document.body.appendChild(div);
}

function restart() {
  document.querySelector('.game-over') && document.querySelector('.game-over').remove();
  init();
}

document.addEventListener('keydown', function(e) {
  var map = {37:0, 38:1, 39:2, 40:3, 65:0, 87:1, 68:2, 83:3};
  var d = map[e.keyCode];
  if (d !== undefined) { e.preventDefault(); move(d); }
});

var touchStartX, touchStartY;
document.addEventListener('touchstart', function(e) {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
});
document.addEventListener('touchend', function(e) {
  if (!touchStartX) return;
  var dx = e.changedTouches[0].clientX - touchStartX;
  var dy = e.changedTouches[0].clientY - touchStartY;
  var adx = Math.abs(dx), ady = Math.abs(dy);
  if (Math.max(adx, ady) < 30) return;
  if (adx > ady) move(dx > 0 ? 2 : 0);
  else move(dy > 0 ? 3 : 1);
  touchStartX = touchStartY = null;
});

document.getElementById('best').textContent = best;
init();
</script>
</body>
</html>
